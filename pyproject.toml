[project]
name = "legalai"
version = "0.1.0"
description = "Multilingual agentic family-law information and decision-support system (research prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "colorama>=0.4.6; sys_platform == 'win32'",
    "qdrant-client>=1.12",  # vector store (embedded mode by default, server via LEGALAI_QDRANT_URL)
    "httpx>=0.27",  # Ollama client
    "cryptography>=43",  # Fernet encryption of stored conversations
    "python-multipart>=0.0.9",  # audio uploads (POST /api/v1/asr)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx2",  # required by starlette.testclient (httpx is deprecated there since Starlette 1.x)
    "ruff>=0.6",
    "mypy>=1.11",
]
# Offline corpus ingestion (PDF text extraction). Install with `uv sync --extra ingest`.
ingest = [
    "pdfplumber>=0.11",
]
# Local embedding model (bge-m3). Heavy (torch); not installed in CI, tests use fake providers.
embed = [
    "sentence-transformers>=3.0",
    "torch>=2.5",
]

# Speech: faster-whisper ASR (CTranslate2, CPU int8 by default) and MMS-TTS (transformers VITS).
speech = [
    "faster-whisper>=1.1",
    "transformers>=4.45",
    "torch>=2.5",
]

[tool.uv]
cache-dir = ".uv-cache"  # C: is nearly full on the dev machine; keep the uv cache on the repo drive

# CUDA build of torch on Windows (RTX GPU); other platforms use the default PyPI wheel.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The importable package `app` lives in backend/app (see docs/adr/0001-python-project-layout.md).
[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Parsers match the real Unicode dashes, quotes and spaces found in legal texts.
"backend/app/ingestion/**" = ["RUF001"]
"backend/app/nlp/speech_text.py" = ["RUF001"]
"tests/unit/ingestion/**" = ["S101", "RUF001"]
# Normalises typographic quotes/dashes when matching quotations against sources.
"backend/app/agents/validation.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend"
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*", "faster_whisper.*", "av.*", "transformers.*"]
ignore_missing_imports = true
